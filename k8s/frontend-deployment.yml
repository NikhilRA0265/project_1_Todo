apiVersion: apps/v1
kind: Deployment
metadata:
  name: app2-frontend
  namespace: app2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app2-frontend
  template:
    metadata:
      labels:
        app: app2-frontend
    spec:
      containers:
        - name: app2-frontend
          image: nikhilrao6225/app2-frontend:v1
          ports:
            - containerPort: 80